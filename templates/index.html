<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- En-tête -->
        <header class="flex justify-between items-center pb-6 border-b border-gray-800">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Mon Hub Personnel</h1>
                <p class="text-sm text-gray-400 mt-1">Vue d'ensemble de mes données</p>
            </div>
            <span class="px-3 py-1 text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">
                ● En ligne
            </span>
        </header>

        <!-- Grille de Modules/Cartes -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Carte Course à pied / Garmin -->
            <a href="/running" class="group block bg-gray-900 border border-gray-800 hover:border-blue-500/50 transition-all rounded-2xl p-6 shadow-xl hover:shadow-blue-500/5">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 bg-blue-500/10 rounded-xl flex items-center justify-center text-2xl text-blue-400 group-hover:scale-110 transition-transform">
                        🏃
                    </div>
                    <span class="text-xs text-blue-400 font-medium group-hover:translate-x-1 transition-transform">Voir tout &rarr;</span>
                </div>
                <h2 class="text-lg font-bold text-white mb-1">Course & Sport</h2>
                <p class="text-xs text-gray-400 mb-4">Dernières sorties, volume hebdomadaire & statistiques Garmin Connect.</p>
                
                <div class="pt-4 border-t border-gray-800/60 flex justify-between text-xs text-gray-300">
                    <span>Clique pour voir le détail des activités</span>
                </div>
            </a>

            <!-- Prochainement : Module Notes / Calendrier -->
            <div class="bg-gray-900/40 border border-gray-800/60 rounded-2xl p-6 opacity-60">
                <div class="w-12 h-12 bg-purple-500/10 rounded-xl flex items-center justify-center text-2xl text-purple-400 mb-4">
                    📅
                </div>
                <h2 class="text-lg font-bold text-white mb-1">Calendrier & Notes</h2>
                <p class="text-xs text-gray-400">Prochainement disponible...</p>
            </div>

        </div>
    </div>
</body>
</html>
